spring.application.name=pedidos
# Puerto local 8083. En Docker, Compose entrega SERVER_PORT=8080.
server.port=${SERVER_PORT:8083}

# Base de datos propia del microservicio (pedidos_db).
# createDatabaseIfNotExist crea la base automaticamente en MySQL local.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pedidos_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate crea y actualiza las tablas a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Direcciones de los otros microservicios que Pedidos consulta.
# En tu PC usa los puertos locales; en Docker/Swarm se reemplazan con
# CLIENTES_URL=http://clientes:8080 y CATALOGO_URL=http://catalogo:8080.
servicios.clientes.url=${CLIENTES_URL:http://localhost:8082}
servicios.catalogo.url=${CATALOGO_URL:http://localhost:8081}
